name: kuery_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.1'

dependencies:
  flutter:
    sdk: flutter
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^2.6.1
  flutter_dotenv: ^6.0.0
  syncfusion_flutter_pdf: ^32.1.23
  path_provider: ^2.1.5
  pinecone: ^0.7.2
  langchain_pinecone: ^0.1.1+2
  langchain_openai: ^0.7.6+1
  langchain: ^0.7.9
  langchain_community: ^0.3.4+2
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.4

dependency_overrides:
  # Work around an analyzer_plugin/analyzer mismatch that breaks build_runner
  # script compilation when using riverpod_generator 2.x.
  analyzer_plugin: 0.13.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/pdf/
    - .env

